# Calls the reusable feature-doc check of synthwerk-blueprint (D-16). Kept as an exception
# (fleet.yml WF-FILE-02): fleet-workflows has no feature-doc stage.
# A PR that changes src/** must also change the docs/features/<slug>.md whose paths: cover it.
# The extra pull_request types run the check again after a label or PR body edit.
name: feature-doc

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: feature-doc-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  feature-doc:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    uses: VelimirMueller/synthwerk-blueprint/.github/workflows/feature-doc.yml@v1
    with:
      source-globs: "src/**"
