# fleet.yml: tier and visibility of this repo (STANDARD.md). Exceptions: docs/rollout.md.
tier: deploys
visibility: public

exceptions:
  - rule: WF-FILE-02
    value: [redeploy.yml, feature-doc.yml]
    reason: fleet-workflows has no rollback by digest and no feature-doc stage. redeploy.yml deploys an older digest with the blueprint deploy and the existing dev secrets; feature-doc.yml runs the blueprint check that keeps docs/features in step with src (D-16).
  - rule: WF-NAME-02
    value:
      ci.yml: [model]
    reason: No fleet stage fetches model weights or runs an eval; the model job runs the real-model tests and the 90 % eval gate on every PR.
  - rule: CI-COST-15
    value: 4
    reason: The model job is the fourth PR job; it is the only run with real weights and the eval gate, and the repo is public (free minutes).
    expires: 2027-04-30
  - rule: GOV-ENV-01
    value: prd-has-reviewer
    reason: prd keeps its required reviewer by decision (fleet-standard#47), so a workflow changed on develop cannot bind prd without the owner; promote-prd is the standard gate.
