# fleet.yml: tier and visibility of this repo (STANDARD.md). Exceptions: docs/rollout.md.
tier: deploys
visibility: public

exceptions:
  - rule: WF-FILE-02
    value: [redeploy.yml]
    reason: fleet-workflows has no rollback by digest; redeploy.yml deploys an older digest with the blueprint deploy and the existing dev secrets.
  - rule: WF-NAME-02
    value:
      ci.yml: [model]
    reason: No fleet stage fetches model weights or runs an eval; the model job runs the real-model tests and the 90 % eval gate on every PR.
  - rule: CI-COST-15
    value: 4
    reason: The model job is the fourth PR job; it is the only run with real weights and the eval gate, and the repo is public (free minutes).
    expires: 2027-04-30
  - rule: GOV-REPO-01
    value: default-branch-main
    reason: The default branch stays main until the control repo creates develop and stage (fleet-standard#7).
  - rule: GOV-RS-02
    value: not-created-yet
    reason: develop does not exist yet; the control repo creates it with its ruleset (fleet-standard#7).
  - rule: GOV-RS-03
    value: not-created-yet
    reason: develop does not exist yet; the control repo creates it with its ruleset (fleet-standard#7).
  - rule: GOV-RS-04
    value: not-created-yet
    reason: stage does not exist yet and main has no ruleset; the control repo creates both (fleet-standard#7).
  - rule: GOV-ENV-01
    value: prd-has-reviewer
    reason: prd keeps its required reviewer and dev its main branch policy until the promote-prd gate and develop exist (fleet-standard#7).
