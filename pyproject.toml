[project]
name = "synthwerk-vision"
version = "0.1.0"
description = "Synthwerk Vision: image classification API (FastAPI, ONNX Runtime, SigLIP 2)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.6",
    "pillow>=13.0",
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "pyyaml>=6.0.3",
    "tokenizers>=0.23.2",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "structlog==26.1.0",
    "opentelemetry-instrumentation-logging==0.66b1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # Starlette >= 1.0 TestClient imports httpx2 (pydantic/httpx2, by the httpx author);
    # plain httpx still works but is deprecated there.
    "httpx2>=2.13",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "nltk>=3.10.3",
    "types-pyyaml>=6.0.12.20260906",
    "jsonschema>=4.26",
    "types-jsonschema>=4.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthwerk_vision"]

[tool.ruff]
line-length = 100
# py313 on purpose: the py314 formatter drops the parentheses in `except (A, B):`
# (PEP 758). That form reads like Python 2 `except A, B` and confuses readers.
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/build_eval_manifest.py" = ["E501"]  # REVIEW is keyed by full Commons file titles

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=synthwerk_vision --cov-report=term-missing"
testpaths = ["tests"]

# Coverage floor (fleet-standard CI-UNIT-02/03): statements and branches together.
[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
